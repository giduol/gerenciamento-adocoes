services:
  db:
    image: postgres:16-alpine
    container_name: gerenciamento-adocoes-db
    environment:
      POSTGRES_DB: gerenciamento_adocoes
      POSTGRES_USER: adocoes
      POSTGRES_PASSWORD: adocoes
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
