spring:
  profiles:
    active: prod
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
