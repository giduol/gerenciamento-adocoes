spring:
  config:
    # Lê variáveis locais de um .env na raiz (ignorado pelo git).
    # Em produção o arquivo não existe e os valores vêm do Northflank.
    import: optional:file:.env[.properties]
  profiles:
    active: prod
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
