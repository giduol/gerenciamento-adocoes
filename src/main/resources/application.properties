spring.application.name=gerenciamento-adocoes
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/gerenciamento_adocoes}
spring.datasource.username=${DB_USERNAME:adocoes}
spring.datasource.password=${DB_PASSWORD:adocoes-local}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB
