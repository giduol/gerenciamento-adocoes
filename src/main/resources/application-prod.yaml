spring:
  main:
    lazy-initialization: true
    banner-mode: off
  jmx:
    enabled: false
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 30000

  jpa:
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
    hibernate:
      # Em produção fica "none". Localmente o .env define DDL_AUTO=update
      # para o Hibernate criar as tabelas no banco do docker compose.
      ddl-auto: ${DDL_AUTO:none}
    show_sql: false
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 10
      min-spare: 2
    max-connections: 30
    accept-count: 10

# Swagger desligado em produção para economizar memória.
# Para reativar, defina SWAGGER_ENABLED=true no Northflank.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}